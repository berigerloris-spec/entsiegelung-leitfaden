<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entsiegelung Leitfaden</title>
<meta name="description" content="Digitale Anwendung des Leitfadens «Entsiegelung und Regenwasser» für Gemeinden ohne eigene Klimafachstelle.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entsiegelung">
<style>
/* Gestaltung ab lf-v21: helle, ruhige Fachanwendung. Petrolgrün #0F6A5F aus der Diplomarbeit.
   Farbrollen und Kontraste: Prüfbericht vom 8.11.2026 (design_palette.json). Dunkel nur auf Wunsch (Einstellungen). */
:root {
  color-scheme: light;
  --bg: #F5F7F9; --card: #FFFFFF; --subtle: #F8FAFB; --body: #2E353F; --ink: #1B2430; --muted: #596573;
  --accent: #0F6A5F; --accent-strong: #0B5149; --accent-ink: #FFFFFF; --light: #EAF4F1;
  --rule: #DDE1E6; --field: #7B8793;
  --warn: #86520C; --warn-bg: #FFF4DF; --warn-edge: #C99A4E;
  --error: #A12D35; --error-bg: #FCEBEC; --ok: #245D40; --ok-bg: #EAF5EE;
  --focus: #0F6A5F; --shadow: 0 1px 2px rgba(27, 36, 48, .05), 0 2px 10px rgba(27, 36, 48, .04);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #11171C; --card: #1A2229; --subtle: #151C22; --body: #D6DDE3; --ink: #F0F3F6; --muted: #A7B2BD;
  --accent: #5EC4B3; --accent-strong: #86D6C9; --accent-ink: #0A2420; --light: #173A35;
  --rule: #2D3943; --field: #7F8C99;
  --warn: #F2C374; --warn-bg: #3A2D14; --warn-edge: #8C6A2C;
  --error: #F5A5AB; --error-bg: #3E1E22; --ok: #93D7B1; --ok-bg: #16322A;
  --focus: #86D6C9; --shadow: none;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="system"] {
    color-scheme: dark;
    --bg: #11171C; --card: #1A2229; --subtle: #151C22; --body: #D6DDE3; --ink: #F0F3F6; --muted: #A7B2BD;
    --accent: #5EC4B3; --accent-strong: #86D6C9; --accent-ink: #0A2420; --light: #173A35;
    --rule: #2D3943; --field: #7F8C99;
    --warn: #F2C374; --warn-bg: #3A2D14; --warn-edge: #8C6A2C;
    --error: #F5A5AB; --error-bg: #3E1E22; --ok: #93D7B1; --ok-bg: #16322A;
    --focus: #86D6C9; --shadow: none;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
#nl-badge-frame { bottom: calc(76px + env(safe-area-inset-bottom)) !important; }
html, body { margin: 0; }
html { scroll-padding-top: 84px; scroll-padding-bottom: 96px; }
body {
  background: var(--bg); color: var(--body);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
  overflow-wrap: break-word;
}
h1, h2, h3, h4 { color: var(--ink); line-height: 1.3; margin: 0 0 .5em; }
h1 { font-size: 1.375rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.0625rem; } h4 { font-size: 1rem; }
h2:focus, h1:focus { outline: none; }
p { margin: 0 0 .75em; }
a { color: var(--accent); text-underline-offset: 2px; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 20; background: var(--card); color: var(--ink); padding: 8px 12px; border-radius: 8px; }
.skip:focus { top: 8px; }

/* Kopf: weiss, Flächenname dunkel, Aktionen zurückhaltend */
header.top {
  background: var(--card); color: var(--ink); border-bottom: 1px solid var(--rule);
  padding: calc(10px + env(safe-area-inset-top)) 20px 10px;
  display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5;
}
header.top h1 { color: var(--ink); margin: 0; font-size: 1.0625rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app-icon { width: 34px; height: 34px; border-radius: 8px; flex: 0 0 auto; }
.top-title { min-width: 0; flex: 1; }
.top-subtitle { display: block; font-size: .875rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.speicherstand { font-size: .875rem; color: var(--muted); white-space: nowrap; }
.speicherstand.fehler { color: var(--error); font-weight: 700; }
main { max-width: 960px; margin: 0 auto; padding: 24px 20px 32px; }
main:focus { outline: none; }

/* Karten */
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow); }
.card > h2:first-child, .card > h3:first-child { margin-top: 0; }
.eyebrow { display: block; font-size: .875rem; font-weight: 600; letter-spacing: .02em; color: var(--muted); margin-bottom: 2px; }
.muted { color: var(--muted); font-size: .9375rem; }
.hint { background: var(--subtle); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin: 12px 0; font-size: .9375rem; }
.warn { background: var(--warn-bg); border: 1px solid var(--warn-edge); border-radius: 10px; padding: 12px 14px; margin: 12px 0; font-size: .9375rem; color: var(--body); }
.warn > b:first-child, .warn h2, .warn h3 { color: var(--warn); }
.warn .muted { color: var(--body); }
.fehlerbox { background: var(--error-bg); border: 1px solid var(--error); border-radius: 10px; padding: 12px 14px; margin: 12px 0; color: var(--body); }
.fehlerbox > b:first-child { color: var(--error); }
.meldung { background: var(--ok-bg); border: 1px solid var(--rule); border-left: 4px solid var(--ok); padding: 10px 14px; border-radius: 0 10px 10px 0; margin: 10px 0; }
.hero { background: var(--card); }

/* Schaltflächen: eine Hauptaktion je Abschnitt, Nebenaktionen neutral */
button, .btn {
  font: inherit; font-weight: 600; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent);
  color: var(--accent-ink); padding: 9px 16px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; line-height: 1.3;
}
button:hover, .btn:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
button.sec, .btn.sec { background: var(--card); color: var(--ink); border-color: var(--field); }
button.sec:hover, .btn.sec:hover { background: var(--subtle); border-color: var(--ink); }
button.danger { background: var(--card); color: var(--error); border-color: var(--error); }
button.danger:hover { background: var(--error-bg); }
button.small { padding: 6px 12px; font-size: .9375rem; min-height: 38px; }
button:disabled { opacity: .55; cursor: default; }
button.link { background: none; border: 0; color: var(--accent); text-decoration: underline; padding: 2px 4px; min-height: 0; font-size: .9375rem; font-weight: 600; }
button.link:hover { background: none; color: var(--accent-strong); }
button.link.gefahr { color: var(--error); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 2px var(--card); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Formulare */
label { display: block; font-weight: 600; color: var(--ink); margin: 14px 0 6px; }
label.inline { font-weight: 400; color: var(--body); display: flex; gap: 10px; align-items: flex-start; margin: 8px 0; cursor: pointer; }
label.inline input { margin-top: 4px; }
input[type=text], input[type=number], input[type=date], input[type=password], input[type=search], textarea, select {
  width: 100%; max-width: 100%; min-width: 0; font: inherit; padding: 9px 12px; border: 1px solid var(--field); border-radius: 8px;
  background: var(--card); color: var(--ink); min-height: 44px;
}
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); flex: 0 0 auto; }
input[aria-invalid=true], textarea[aria-invalid=true] { border: 2px solid var(--error); }
.feldfehler { color: var(--error); font-weight: 600; font-size: .9375rem; margin: 6px 0 0; }
textarea { min-height: 76px; resize: vertical; }
input[type=file] { width: 100%; font: inherit; padding: 9px; border: 1px solid var(--field); border-radius: 8px; background: var(--card); color: var(--body); }

/* Ablage */
.dropzone { margin: 12px 0; padding: 22px 16px; border: 2px dashed var(--field); border-radius: 12px; background: var(--subtle); color: var(--ink); text-align: center; cursor: pointer; }
.dropzone:hover { border-color: var(--accent); }
.dropzone.drag { background: var(--light); border-color: var(--accent); border-style: solid; }
.dropzone b { display: block; margin-bottom: 3px; }
.dropzone svg { width: 30px; height: 30px; color: var(--accent); }
.dz-status:not(:empty) { margin-top: 8px; font-weight: 600; }

/* Listenzeilen */
.item-zeile { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: transparent; color: var(--body); border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; padding: 14px 6px; min-height: 0; font-weight: 400; }
.item-zeile:last-child { border-bottom: 0; }
.item-zeile:hover { background: var(--subtle); border-color: var(--rule); }
.item-zeile > span:nth-child(2) { flex: 1; min-width: 0; }
.item-zeile b { color: var(--ink); }
.haken { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; border: 2px solid var(--field); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .875rem; color: var(--muted); }
.haken.ja { background: var(--ok); border-color: var(--ok); color: var(--card); }
.haken.nein { background: var(--error); border-color: var(--error); color: var(--card); }
.qkopf { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.qkopf label { margin: 0; }
details.mini { border: 0; padding: 0; margin: 2px 0 8px; background: transparent; }
details.mini summary { font-weight: 600; color: var(--accent); font-size: .9375rem; }

/* Belege aus Unterlagen: neutral, Quelle nachgeordnet */
.beleg { border: 1px solid var(--rule); border-left: 3px solid var(--accent); background: var(--subtle); border-radius: 0 10px 10px 0; padding: 10px 14px; margin: 8px 0 12px; font-size: .9375rem; }
.beleg p { margin: 4px 0; color: var(--ink); }
.beleg, .punkt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: start; }
.punkt { margin-top: 12px; }
.aktionen { display: flex; flex-direction: column; align-items: stretch; gap: 6px; min-width: 200px; max-width: 270px; text-align: center; }
.aktionen .muted { font-size: .875rem; text-align: right; }
.empfehlung { background: var(--light); color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 3px 12px; font-size: .875rem; font-weight: 700; }
.empfehlung.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.empfehlung.abw { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-edge); }
.beleg-titel { display: block; font-size: .875rem; font-weight: 700; color: var(--muted); }
.quelle { color: var(--muted); font-size: .875rem; }
.quellen-fuss { margin-top: 18px; font-size: .875rem; }
.todo { margin: 6px 0 10px; font-size: .9375rem; color: var(--ink); }
.todo::before { content: '→ '; color: var(--accent); font-weight: 700; }
.start { border-top: 4px solid var(--accent); }
ul.eingang { margin: 4px 0 0; padding-left: 18px; }
.nw { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin: 10px 0; background: var(--card); }
.nw b { color: var(--ink); font-weight: 600; }
.nw-beleg { margin: 6px 0 0; font-size: .9375rem; }
.nw-form { margin-top: 10px; border-top: 1px solid var(--rule); padding-top: 4px; }
.nw-hist { margin: 6px 0 0; font-size: .9375rem; color: var(--muted); }
.warnzeile { margin: 6px 0 0; font-size: .9375rem; color: var(--warn); font-weight: 600; }
.aktive { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: .9375rem; overflow-wrap: anywhere; }
.fiktiv-banner { border: 2px solid var(--warn); color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; font-weight: 700; }
.fiktiv-wz { position: fixed; top: 45%; left: 0; right: 0; text-align: center; font-size: 64px; font-weight: 800; color: rgba(134, 82, 12, .13); transform: rotate(-25deg); pointer-events: none; }
.bericht h3 { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--rule); }
.bericht h4 { margin: 14px 0 6px; }
.naechster { border: 1px solid var(--rule); border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0; padding: 12px 14px; margin: 12px 0; background: var(--card); }
.flaechen { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin: 14px 0; }
ul.pruefliste { list-style: none; padding: 0; margin: 8px 0; font-size: .9375rem; }
ul.pruefliste li { margin: 4px 0; }
ul.pruefliste li.ok { color: var(--ok); } ul.pruefliste li.warn { color: var(--error); font-weight: 600; } ul.pruefliste li.offen { color: var(--ink); }
.doc { padding: 12px 14px; }
.doc-kopf { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.doc-info { min-width: 0; flex: 1; }
.doc-info b { display: block; color: var(--ink); overflow-wrap: anywhere; }
.doc-thumb, .doc-icon { width: 54px; height: 54px; flex: 0 0 54px; border-radius: 8px; border: 1px solid var(--rule); background: var(--subtle); object-fit: cover; }
.doc-icon { display: flex; align-items: center; justify-content: center; font-size: .875rem; font-weight: 700; color: var(--accent); }

/* Segmentauswahl: gewählte Antwort mit Haken, nicht nur Farbe */
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--field); border-radius: 8px; overflow: hidden; background: var(--card); max-width: 100%; }
.seg button { border: 0; border-radius: 0; background: transparent; color: var(--ink); padding: 8px 16px; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--field); }
.seg button:hover { background: var(--subtle); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.seg button.on::before { content: '✓' / ''; }

/* Navigation unten */
nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--rule);
  display: flex; justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 5;
}
nav.tabs button { background: transparent; border: 0; color: var(--muted); padding: 6px 4px; min-height: 52px; font-size: .875rem; font-weight: 600; flex: 1; max-width: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 10px; }
nav.tabs button:hover { background: var(--subtle); }
nav.tabs button.on { color: var(--accent); background: var(--light); }
nav.tabs svg { width: 22px; height: 22px; }

/* Schrittleiste: nummeriert, aktueller Schritt deutlich, erledigt mit Haken */
.steps { display: flex; gap: 4px; overflow-x: auto; padding: 6px; margin-bottom: 16px; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; scrollbar-width: thin; }
.steps button { position: relative; white-space: nowrap; background: transparent; color: var(--body); border: 0; min-height: 44px; padding: 6px 12px; font-weight: 600; border-radius: 8px; flex: 0 0 auto; }
.steps button:hover { background: var(--subtle); }
.sr { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.item-zeile, .steps { position: relative; }
.steps .nr { display: inline-flex; min-width: 24px; padding: 0 5px; height: 24px; border-radius: 12px; border: 1.5px solid var(--field); align-items: center; justify-content: center; font-size: .875rem; color: var(--muted); }
.steps .nr.fertig { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.steps button.on { background: var(--light); color: var(--accent); }
.steps button.on .nr { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Tabellen: eigener Scrollbereich oder gestapelt, nie Seitenüberlauf */
.tabelle { overflow-x: auto; max-width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { color: var(--ink); font-weight: 600; }
thead th { background: var(--subtle); }
table.kontrolle th, table.zwei th { width: 34%; }

/* Status-Kennzeichen: Text plus Zeichen, nie nur Farbe */
.tag { display: inline-flex; align-items: baseline; gap: 4px; border-radius: 999px; padding: 1px 10px; font-size: .875rem; font-weight: 600; border: 1px solid transparent; line-height: 1.5; }
.tag::before { font-weight: 700; }
.tag.vor { background: var(--accent); color: var(--accent-ink); }
.tag.offen { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-edge); }
.tag.offen::before { content: '!' / ''; }
.tag.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.tag.ok::before { content: '✓' / ''; }
.tag.no { background: var(--error-bg); color: var(--error); border-color: var(--error); }
.tag.no::before { content: '✕' / ''; }
.tag.info { background: var(--subtle); color: var(--body); border-color: var(--field); }
.tag.info::before { content: 'i' / ''; }

.q { padding: 16px 0 12px; margin: 0; border-top: 1px solid var(--rule); }
.card > .q:first-of-type { border-top: 0; }
.q .qt { font-weight: 700; color: var(--ink); margin-bottom: 6px; font-size: 1.0625rem; }
.mass { border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; margin: 12px 0; background: var(--card); }
.mass.struck { background: var(--subtle); border-style: dashed; border-color: var(--field); }
.mass .mh { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.mass .mh b { color: var(--ink); }
dl.db { display: grid; grid-template-columns: minmax(110px, 30%) 1fr; gap: 8px 14px; margin: 0; }
dl.db dt { font-weight: 600; color: var(--ink); }
dl.db dd { margin: 0; }
details { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; margin: 10px 0; background: var(--card); }
details summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.result { border: 1px solid var(--rule); border-top: 4px solid var(--accent); border-radius: 12px; padding: 18px 20px; background: var(--card); }
.result h2 { font-size: 1.1875rem; }
dialog { border: 0; border-radius: 12px; padding: 0; max-width: 640px; width: calc(100% - 32px); background: var(--card); color: var(--body); }
dialog::backdrop { background: rgba(17, 23, 28, .5); }
dialog .dh { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--rule); }
dialog .dh h2 { margin: 0; }
dialog .dc { padding: 18px; max-height: 70vh; overflow: auto; }
.fehlerbanner { position: fixed; left: 12px; right: 12px; top: 12px; z-index: 50; background: var(--error); color: #fff; padding: 12px 14px; border-radius: 10px; font-size: .9375rem; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.speicherwarnung { position: sticky; top: 56px; z-index: 4; margin: 0 0 14px; }
.print-only { display: none; }

@media (max-width: 560px) {
  main { padding: 16px 16px 24px; }
  .card { padding: 16px; }
  .top-subtitle, .app-icon, #install { display: none; }
  header.top { padding-left: 10px; padding-right: 10px; }
  header.top { gap: 8px; padding-left: 16px; padding-right: 16px; }
  .beleg, .punkt { grid-template-columns: minmax(0, 1fr); }
  .aktionen { max-width: none; min-width: 0; }
  dl.db { grid-template-columns: 1fr; } dl.db dd { margin-bottom: 6px; }
  /* Gestapelte Tabellen: jede Zeile als beschrifteter Datensatz */
  table.stapel, table.stapel tbody, table.stapel tr, table.stapel th, table.stapel td { display: block; width: auto; }
  table.stapel thead { display: none; }
  table.stapel tr { border-bottom: 1px solid var(--rule); padding: 8px 0; }
  table.stapel th, table.stapel td { border: 0; padding: 2px 0; }
  table.stapel td[data-label]::before { content: attr(data-label) ': '; font-weight: 600; color: var(--muted); }
  table.kontrolle th, table.zwei th { width: auto; }
  .seg button { padding: 8px 12px; }
}

/* Zahnrad, Seitenleiste «Dateiablage» und Layout (lf-v23) */
.icon-btn { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 10px; background: var(--card); color: var(--ink); border: 1px solid var(--field); flex: 0 0 auto; gap: 8px; }
.icon-btn:hover { background: var(--subtle); border-color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; flex: 0 0 auto; }
.icon-btn.mini { width: 36px; height: 36px; min-height: 36px; border-radius: 8px; }
.icon-btn.mini svg { width: 18px; height: 18px; }
.icon-btn.on, .icon-btn[aria-current="page"] { background: var(--light); color: var(--accent); border-color: var(--accent); }
.ablage-btn { width: auto; padding: 0 12px; font-size: .9375rem; }
header.top { gap: 10px; }
.layout { display: flex; align-items: flex-start; }
.layout > main { flex: 1 1 auto; min-width: 0; width: 100%; }

<script>
// Muss mit VERSION in sw.js übereinstimmen; wird in den Einstellungen und unter jeder Ablage angezeigt.
const APP_VERSION = 'lf-v23';
// Version des gespeicherten Datenformats (Flächen, Einstellungen, Ablage). 1 = bis lf-v20 ohne Angabe.
const DATEN_VERSION = 3;   // 3 = Projekte mit Ordnern (lf-v23); 2 = lf-v21/22; 1 = bis lf-v20

// Unerwartete Fehler sichtbar melden statt still abzubrechen.
function fehlerZeigen(text) {
  let b = document.getElementById('fehlerbanner');
  if (!b) {
    b = Object.assign(document.createElement('div'), { id: 'fehlerbanner', role: 'alert', className: 'fehlerbanner' });
    b.onclick = () => b.remove();
    document.body.appendChild(b);
  }
  b.textContent = T('Fehler: {0} (Version {1}, antippen zum Schliessen)', text, APP_VERSION);
}
window.addEventListener('error', e => fehlerZeigen(e.message || 'unbekannt'));
window.addEventListener('unhandledrejection', e => fehlerZeigen(e.reason?.message || String(e.reason)));
function ansagen(text) { const a = document.getElementById('ansage'); if (a) { a.textContent = ''; setTimeout(() => a.textContent = text, 50); } }

// ---------- Datenprüfung und Migration ----------
// Jede Fläche, ob gespeichert oder aus einer Sicherung, wird vollständig geprüft, bevor sie übernommen wird.
// Fehlende Teilstrukturen älterer gültiger Fassungen werden ergänzt; widersprüchliche oder unsichere Daten
// werden mit Begründung abgewiesen und nie still verändert oder gelöscht.
const ID_MUSTER = /^[A-Za-z0-9_-]{1,64}$/;
const MASSNAHME_KEYS = ['D1', 'D2', 'D3', 'D4', 'D5', 'D6', 'D7', 'D8', 'ZG'];
const NW_STATI = ['unterlage', 'markiert', 'bestaetigt', 'nein'];
const istObj = o => o !== null && typeof o === 'object' && !Array.isArray(o);
const istText = v => typeof v === 'string';
const istZahlText = v => v === '' || v === null || v === undefined || (typeof v === 'number' && Number.isFinite(v)) || (typeof v === 'string' && v.length < 40);
const jnWert = v => v === true || v === false || v === null;
function flaecheNormalisieren(f, fehler, wo) {
  const fe = t => fehler.push(`${wo}: ${t}`);
  if (!istObj(f)) { fe(T('ist kein Datensatz')); return null; }
  if (!istText(f.id) || !ID_MUSTER.test(f.id)) { fe(T('ungültige oder fehlende Kennung (nur Buchstaben, Ziffern, - und _ erlaubt)')); return null; }
  if (!istText(f.name) || !f.name.trim() || f.name.length > 300) { fe(T('fehlender oder ungültiger Name')); return null; }
  for (const k of ['ort', 'erfasst', 'notiz', 'begruendung']) { if (f[k] === undefined || f[k] === null) f[k] = ''; else if (!istText(f[k])) fe(`${T('Feld «{0}» ist kein Text', k)}`); }
  if (!istZahlText(f.gefM2 ?? '')) fe(T('gefährdete Fläche hat einen ungültigen Typ')); f.gefM2 ??= '';
  if (!istZahlText(f.gefaelle ?? '')) fe(T('Gefälle hat einen ungültigen Typ')); f.gefaelle ??= '';
  f.stufen = istObj(f.stufen) ? f.stufen : (f.stufen === undefined ? {} : (fe(T('Stufen sind ungültig')), {}));
  for (const k of ['ueberw', 'versieg', 'ueberfl']) { f.stufen[k] ??= 0; if (![0, 1, 2, 3].includes(f.stufen[k])) fe(`${T('Stufe «{0}» ist nicht 0 bis 3', k)}`); }
  f.anlass = istObj(f.anlass) ? f.anlass : (f.anlass === undefined ? {} : (fe(T('Sanierungsanlass ist ungültig')), {}));
  f.anlass.saniert ??= null; if (![true, false, null, 'offen'].includes(f.anlass.saniert)) fe(T('Sanierungsanlass hat einen ungültigen Wert'));
  for (const k of ['zeitpunkt', 'notiz']) { f.anlass[k] ??= ''; if (!istText(f.anlass[k])) fe(`${T('Anlass «{0}» ist kein Text', k)}`); }
  f.st = istObj(f.st) ? f.st : (f.st === undefined ? {} : (fe(T('Standortangaben sind ungültig')), {}));
  for (const k of ['befestigt', 'sicker', 'baumplatz', 'rueckhalt', 'dachwasser']) { f.st[k] ??= null; if (!jnWert(f.st[k])) fe(`${T('Standortangabe «{0}» ist nicht Ja/Nein/offen', k)}`); }
  f.st.ziel = istObj(f.st.ziel) ? f.st.ziel : {};
  for (const k of ['gruen', 'd5', 'd6']) { f.st.ziel[k] ??= false; if (typeof f.st.ziel[k] !== 'boolean') fe(`${T('Zielanlage «{0}» ist nicht Ja/Nein', k)}`); }
  if (f.st.zielKeine !== undefined && typeof f.st.zielKeine !== 'boolean') fe(T('Angabe «keine Zielanlage» ist ungültig'));
  f.abkl = istObj(f.abkl) ? f.abkl : {};
  for (const [k, a] of Object.entries(f.abkl)) {
    if (!istObj(a)) { fe(`${T('Abklärung «{0}» ist ungültig', k)}`); continue; }
    if (a.status !== undefined && !['offen', 'geklaert', 'unterlage'].includes(a.status)) fe(`${T('Abklärung «{0}» hat einen ungültigen Status', k)}`);
    a.notiz ??= ''; if (!istText(a.notiz)) fe(`${T('Notiz der Abklärung «{0}» ist kein Text', k)}`);
  }
  f.gestrichen = Array.isArray(f.gestrichen) ? f.gestrichen : [];
  f.gestrichen.forEach((g, i) => { if (!istObj(g) || !MASSNAHME_KEYS.includes(g.key) || (g.grund !== undefined && !istText(g.grund))) fe(`${T('Streichung {0} ist ungültig', i + 1)}`); });
  f.zulaessig = istObj(f.zulaessig) ? f.zulaessig : {};
  f.rand = istObj(f.rand) ? f.rand : {};
  for (const v of Object.values(f.rand)) if (typeof v !== 'boolean') { fe(T('Randbedingungen sind ungültig')); break; }
  f.flaechen = istObj(f.flaechen) ? f.flaechen : {};
  for (const [k, v] of Object.entries(f.flaechen)) if (!(typeof v === 'boolean' || istZahlText(v))) fe(`${T('Flächenangabe «{0}» hat einen ungültigen Typ', k)}`);
  f.herkunft = istObj(f.herkunft) ? f.herkunft : {};
  for (const [k, h] of Object.entries(f.herkunft)) {
    if (typeof h === 'string') { f.herkunft[k] = { name: h }; continue; }
    if (!istObj(h) || (h.docId !== undefined && h.docId !== null && !(istText(h.docId) && ID_MUSTER.test(h.docId)))) fe(`${T('Herkunftsangabe «{0}» ist ungültig', k)}`);
  }
  f.nachweise = istObj(f.nachweise) ? f.nachweise : {};
  for (const [id, n] of Object.entries(f.nachweise)) {
    if (!istObj(n)) { fe(`${T('Prüfpunkt «{0}» ist ungültig', id)}`); continue; }
    if (id.includes('.')) continue; // Altformat bis lf-v19, wird unten migriert
    if (!NACHWEISE[id]) { fe(`${T('unbekannter Prüfpunkt «{0}»', id)}`); continue; }
    if (!NW_STATI.includes(n.status)) fe(`${T('Prüfpunkt «{0}» hat einen ungültigen Status', id)}`);
    if (n.status === 'bestaetigt' && !(istObj(n.fach) && istText(n.fach.gegenstand) && n.fach.gegenstand && n.fach.seite)) fe(`${T('Fachnachweis «{0}» ohne Dokument, Seite oder Prüfgegenstand', id)}`);
    if (n.status === 'unterlage' && !istObj(n.quelle)) fe(`${T('Prüfpunkt «{0}» ohne Quelle', id)}`);
    for (const q of [n.quelle, n.fach]) if (q && q.docId !== undefined && q.docId !== null && !(istText(q.docId) && ID_MUSTER.test(q.docId))) fe(`${T('Prüfpunkt «{0}» verweist auf eine ungültige Unterlage', id)}`);

const PDF_MAX = 500;
async function pdfText(buffer, info = {}) {
  const lib = await pdfjs();

  catch (e) { throw Object.assign(new Error(e.name === 'PasswordException' ? T('Das PDF ist passwortgeschützt.') : T('Das PDF ist beschädigt oder nicht lesbar.')), { art: e.name === 'PasswordException' ? 'passwort' : 'defekt' }); }
  const teile = [];

    const c = await (await doc.getPage(i)).getTextContent();
    // Zeilenenden im PDF sind meist Umbrüche mitten im Satz, keine Absätze.
    teile.push(c.items.map(x => x.str + (x.hasEOL ? ' ' : '')).join('').replace(/-\s(?=[a-zäöü])/g, '').replace(/\s+/g, ' '));
  }
  doc.destroy();
  // Wiederkehrende Kopfzeilen (gleicher Anfang auf allen Seiten, danach die Seitenzahl) entfernen.
  if (teile.length > 1) {
    let kopf = teile[0];
    for (const s of teile.slice(1)) { let n = 0; while (n < kopf.length && kopf[n] === s[n]) n++; kopf = kopf.slice(0, n); }
    kopf = kopf.slice(0, kopf.lastIndexOf(' ') + 1);
    if (kopf.trim().length >= 15) teile.forEach((s, i) => teile[i] = s.slice(kopf.length).replace(/^\s*\d{1,3}\s+/, ''));

  return teile.join('\f');

function nwEdit(m, nk, art) { view.nwEdit = { m, nk, art }; view.nwFehler = null; view.nwVorlage = null; view.nwVorlageFach = null; rerender(); document.getElementById(art === 'fach' ? 'nwDok' : 'nwText')?.focus(); }

  if (paket(f).baumFrage || f.st.baumplatz !== null) standort.push([T('Baumplatz vorhanden'), f.st.baumplatz, 'st.baumplatz']);
  const fiktivHinweis = T('<div class="fiktiv-banner">FIKTIVER TESTFALL · Die Standortunterlagen sind als fiktiv gekennzeichnet. Dieser Bericht enthält keine realen Standortnachweise.</div>');

    <div class="${vorlaeufig ? 'warn' : 'meldung'}">${T('<b>{0}</b>: {1} <br><b>Nächster Schritt:</b> {2}{3}.{4}', vorlaeufig ? T('Vorläufige Vorauswahl') : T('Vorauswahl mit allen Prüfpunkten dieser Checkliste erfasst'), vorlaeufig ? `${T('{0} offene Punkte. Keine abschliessende Beurteilung.', offen.length)}` : T('keine offenen Punkte. Keine Ausführungsfreigabe.'), esc(n.text), n.fertig && !n.keinPaket && f.anlass.zeitpunkt ? ' (' + esc(f.anlass.zeitpunkt) + ')' : '', !n.fertig && p.items.length && bestimmt ? T(' Das Paket erst nach Klärung der offenen Punkte im Sanierungsprojekt einplanen; bis dahin vormerken.') : '')}</div>

    <tr><th>${T('Offene Punkte')}</th><td>${T('{0} (Abschnitt 2)', offen.length)}</td></tr>
    <tr><th>${T('Ausschluss und Nichtauswahl')}</th><td>${T('{0} ausgeschlossen · {1} im Zweig nicht vorgeschlagen · {2} ungeklärt (Abschnitt 3)', kat('ausgeschlossen').length, kat('nicht_vorgeschlagen').length, kat('ungeklaert').length)}</td></tr></table></div>

// Alle übernommenen und selbst eingegebenen Angaben mit Wert und Herkunft (für die Kontrolle vor dem Export).
function angabenListe(f) {
  const jn = v => v === true ? T('Ja') : v === false ? T('Nein') : v === 'offen' ? T('noch offen') : String(v);
  const felder = [
    ['stufen.ueberw', T('Stufe Überwärmung'), v => STUFE[v]], ['stufen.versieg', T('Stufe Versiegelung'), v => STUFE[v]], ['stufen.ueberfl', T('Stufe Überflutung'), v => STUFE[v]],
    ['anlass.saniert', T('Sanierung steht an'), jn], ['anlass.zeitpunkt', T('Zeitpunkt der Sanierung')], ['gefaelle', T('Gefälle'), v => v + ' %'], ['gefM2', T('Gefährdete Fläche'), v => v + ' m²'],
    ['st.befestigt', T('Fläche bleibt befestigt'), jn], ['st.sicker', T('Untergrund nimmt Wasser auf'), jn], ['st.rueckhalt', T('Rückhalteraum mit Überlauf'), jn],
    ['st.dachwasser', T('Dachwasser nutzbar'), jn], ['st.baumplatz', T('Baumplatz vorhanden'), jn], ['st.ziel.gruen', T('Ziel Grünfläche'), jn], ['st.ziel.d5', T('Ziel Baumrigole'), jn], ['st.ziel.d6', T('Ziel Mulde'), jn],
    ...FLAECHEN_FELDER.map(k => ['flaechen.' + k, FLAECHEN_NAME[k], v => typeof v === 'boolean' ? jn(v) : v + ' m²'])
  ];
  const uebernommen = [], eigen = [];
  for (const [pfad, name, fmt = x => x] of felder) {
    const v = getPfad(f, pfad);
    // Nicht gesetzte Werte und unberührte Haken sind keine Angaben.
    if (v === null || v === '' || (v === 0 && pfad.startsWith('stufen.')) || (v === false && (pfad.startsWith('st.ziel.') || pfad.startsWith('flaechen.')))) continue;
    const q = f.herkunft?.[pfad];
    (q ? uebernommen : eigen).push(`${esc(name)}: ${esc(String(fmt(v)))}${q ? ' ' + quelleKurz(f, q) : ''}${q?.widerspruch ? T(' <b>(Unterlagen widersprüchlich, vom Nutzer gewählt)</b>') : ''}`);
  }
  LF.abklaerungen.forEach(a => {
    const s = f.abkl[a.key]?.status;
    if (s === 'unterlage') uebernommen.push(`${T('Abklärung «{0}» {1}', esc(a.titel), quelleKurz(f, f.herkunft?.['abkl.' + a.key]))}`);
    else if (s === 'geklaert') eigen.push(`${T('Abklärung «{0}»: als geklärt markiert', esc(a.titel))}`);
  });
  Object.entries(f.nachweise || {}).forEach(([nk, n]) => {
    if (!NACHWEISE[nk]) return;
    if (n.status === 'unterlage') uebernommen.push(`${T('Prüfpunkt «{0}» {1}', esc(NACHWEISE[nk].t), quelleKurz(f, n.quelle))}`);
    else eigen.push(`${T('Prüfpunkt «{0}»: {1}{2}', esc(NACHWEISE[nk].t), NW_LABEL[n.status], n.status === 'bestaetigt' ? ' (' + esc(n.fach.gegenstand) + ', ' + quelleKurz(f, n.fach) + ')' : '')}`);
  });
  return { uebernommen, eigen };
}

// Offene Punkte: jede Lücke nur einmal, mit allen betroffenen Massnahmen und der zuständigen Stelle.
// «Laut Leitfaden» = Ablauftabelle des Leitfadens; «Vorschlag» = nicht dokumentiert.
const ABKL_NW = { gws: 'gw', untergrund: 'sicker', wasser: 'material', quelle: 'quelle' };
const ZUSTAENDIG = {
  sicker: _('Fachbüro für den Sickertest'), gw: _('kantonale Fachstelle Grundwasser'), verkehr: _('Tiefbau'), belagBemessung: _('Fachplanung Tiefbau'), schadstoff: _('Fachbüro Boden'),
  verdichtung: _('Tiefbau'), aushub: _('Tiefbau'), ortsbild: _('Planung, bei Bedarf Denkmalpflege'), blendung: _('Planung'), leitungen: _('Werke'), wurzelraum: _('Grünraum mit Tiefbau'),
  artenwahl: _('Grünraum'), quelle: _('Tiefbau mit Gebäudeeigentümerschaft'), einstau: _('Fachplanung Grünraum'), verhaeltnis: _('Fachplanung Siedlungsentwässerung'),
  notueberlauf: _('Fachplanung Siedlungsentwässerung'), hang: _('Fachplanung Tiefbau'), trag: _('Bauingenieur im Auftrag der Gebäudeeigentümerschaft'),
  abdichtung: _('Gebäudeeigentümerschaft mit Fachplanung Dach'), unterhalt: _('Werkhof oder Grünraum'), material: _('Gebäudeeigentümerschaft'), ug: _('Gebäudeeigentümerschaft'), zielflaeche: _('Tiefbau mit Grünraum')
};
const laut = n => `${T('{0} (laut Leitfaden, Schritt {1})', LF.schritte[n - 1].stelle, n)}`;
function offenePunkte(f, p) {
  const out = [], bestimmt = !p.offen && !zielOffen(f);
  if (!erledigt(f)[1]) out.push({ was: T('Belastung einstufen (Bewertungskarte Klima, amtliche Vermessung, Gefährdungskarte Oberflächenabfluss)'), betroffen: T('Vorrang der Fläche'), wer: laut(1) });
  if (f.anlass.saniert !== true && f.anlass.saniert !== false) out.push({ was: T('Klären, ob auf der Fläche ohnehin eine Sanierung ansteht'), betroffen: T('Zeitpunkt aller Massnahmen'), wer: laut(2) });
  if (zielOffen(f)) out.push({ was: T('Festlegen, wohin das Dachwasser fliessen kann (Grünfläche, Baumrigole oder Mulde)'), betroffen: 'D5, D6, D7, D8', wer: laut(3) });
  else if (p.offen) out.push({ was: FRAGEN[p.offen].frage, betroffen: [...moeglich(f)].join(', ') || '–', wer: laut(3) });
  const nkMap = new Map();
  if (bestimmt) p.items.forEach(it => (MASSNAHME_NACHWEISE[it.key] || []).forEach(nk => {
    const s = nwStatus(f, nk);
    if (ERFASST.includes(s) || s === 'nein') return;
    if (!nkMap.has(nk)) nkMap.set(nk, []);
    nkMap.get(nk).push(it.key === 'ZG' ? T('Zielanlage Grünfläche') : it.key);
  }));
  const abgedeckt = new Set();
  for (const [nk, betroffen] of nkMap) {
    const gegen = nachweisBelege(f, nk).find(x => x.tendenz === 'offen');
    const abkl = Object.entries(ABKL_NW).filter(([a, n]) => n === nk && !abklErledigt(f, a, true)).map(([a]) => (abgedeckt.add(a), LF.abklaerungen.find(x => x.key === a).titel));
    let was = esc(NACHWEISE[nk].t) + (nwStatus(f, nk) === 'widerspruechlich' ? T(' <b>(Unterlagen widersprüchlich)</b>') : '');
    if (nk === 'verhaeltnis' && f.flaechen?.angeschlossenOffen) was += T('; angeschlossene Dachfläche offen');
    if (gegen) was += `${T('<br><span class="muted">Laut Unterlage offen: «{0}» {1}</span>', esc(gegen.text), quellAngabe(gegen))}`;
    if (abkl.length) was += `${T('<br><span class="muted">Deckt auch die Abklärung «{0}» ab.</span>', esc(abkl.join('», «')))}`;
    out.push({ was, html: true, betroffen: betroffen.join(', '), wer: `${T('{0}; Vorschlag: {1}', laut(NACHWEISE[nk].bem ? 5 : 4), ZUSTAENDIG[nk])}` });
  }
  LF.abklaerungen.forEach(a => {
    if (abgedeckt.has(a.key) || abklErledigt(f, a.key)) return;
    // Bereits über den zugehörigen Prüfpunkt erfasst: nicht nochmals abfragen.
    out.push({ was: `${a.titel}: ${TODO[a.key]}`, betroffen: T('alle Massnahmen am Standort'), wer: laut(3) });
  });
  if (f.flaechen?.angeschlossenOffen && !nkMap.has('verhaeltnis')) out.push({ was: T('Tatsächlich angeschlossene Dachfläche bemessen'), betroffen: T('Massnahmen mit Dachwasser'), wer: `${T('{0}; Vorschlag: {1}', laut(5), ZUSTAENDIG.verhaeltnis)}` });
  if (p.items.length && LF.randbedingungen.some(r => !f.rand[r.key])) out.push({ was: T('Randbedingungen prüfen: {0}', LF.randbedingungen.filter(r => !f.rand[r.key]).map(r => r.text).join(', ')), betroffen: T('ganzes Paket'), wer: laut(5) });
  return out;
}

// Warum eine Massnahme nicht im Paket ist, in drei getrennten Kategorien. Die Auswahlregeln des
// Entscheidungsbaums bleiben unverändert; unbekannte Angaben führen nie zu «ausgeschlossen».
function ausschluesse(f, p) {
  const offenModus = !!p.offen || zielOffen(f), s = f.st, out = [];
  const mgl = !offenModus ? new Set() : zielOffen(f) ? new Set([...moeglich(mitAntwort(f, 'st.ziel.gruen', true)), ...moeglich(mitAntwort(f, 'st.zielKeine', true))]) : moeglich(f);
  const frage = zielOffen(f) ? T('Wohin kann das Dachwasser fliessen?') : p.offen ? FRAGEN[p.offen].frage : '';
  const drin = new Set(p.items.map(it => it.key));
  const beleg = feld => {
    const i = quellenListe(f).findIndex(d => d.werte?.[feld]);
    return i < 0 ? '' : ` <span class="muted">«${esc(quellenListe(f)[i].werte[feld].beleg)}» [${i + 1}]</span>`;
  };
  const hatBeleg = feld => quellenListe(f).some(d => d.werte?.[feld]);
  const zielName = p.items.find(it => it.alsZiel || it.key === 'ZG');
  const A = g => ({ kat: 'ausgeschlossen', grund: g }), N = g => ({ kat: 'nicht_vorgeschlagen', grund: g });
  const regel = k => {
    if (k === 'D2') return s.befestigt === true ? N(T('Die Fläche muss befestigt bleiben (F1).') + beleg('befestigt')) : null;
    if (k === 'D1') return s.befestigt === false ? N(T('Zweig «vollständig entsiegeln» (F1 nein).')) : s.sicker === false ? A(T('Der Untergrund nimmt kein Wasser auf (F2).') + beleg('sicker')) : null;
    if (k === 'D3') return s.befestigt === false ? N(T('Zweig «vollständig entsiegeln» (F1 nein).')) : s.sicker === true ? N(T('In diesem Entscheidungsbaumzweig nicht vorgeschlagen: D3 ist für den Zweig F2 nein vorgesehen.')) : null;
    if (k === 'D4') {
      if (s.baumplatz === false) return A(T('Kein Baumplatz vorhanden.') + beleg('baumplatz'));
      if (s.sicker === false && s.rueckhalt === false) return A(T('Kein Rückhalteraum mit Überlauf bei dichtem Untergrund.'));
      if (drin.has('D8')) return N(T('Im Zweig mit Dachwasser (F3 ja) nicht vorgeschlagen.'));
      return null;
    }
    // D5 bis D8: Zweig mit Dachwasser
    if (s.befestigt === false) return N(T('Zweig «vollständig entsiegeln» (F1 nein).'));
    if (s.sicker === false) return k === 'D7' ? N(T('Im Zweig F2 nein nicht vorgeschlagen.')) : A(T('Der Untergrund nimmt kein Wasser auf (F2).') + beleg('sicker'));
    if (s.dachwasser === false) {
      const g = T('Das Dachwasser ist nicht nutzbar (F3).') + beleg(hatBeleg('dachMetall') ? 'dachMetall' : 'dachwasser');
      return k === 'D7' ? N(g + ' ' + T('Ein Retentionsdach wäre als eigener Fachprüfpunkt zu beurteilen (Tragreserve, Abdichtung).')) : A(g);
    }
    if (s.dachwasser !== true) return null;
    if (!drin.has('D8')) {
      if (k === 'D7') return N(T('Nur im Paket mit Dachwasser vorgesehen; ohne Zielanlage als eigener Fachprüfpunkt zu beurteilen.'));
      if (k === 'D5' && hatBeleg('zielD5')) return A(T('Kein Platz für eine Baumrigole.') + beleg('zielD5'));
      if (k === 'D6' && hatBeleg('zielD6')) return A(T('Keine Freifläche für eine Mulde.') + beleg('zielD6'));
      return N(T('Keine Zielanlage für das Dachwasser angegeben.'));
    }
    const ziel = esc(zielName ? itemName(zielName, true) : T('eine andere Zielanlage'));
    if (k === 'D5') return s.ziel.d5 ? N(`${T('Das Dachwasser fliesst bereits in {0}; dasselbe Wasser zählt nur einmal.', ziel)}`) : hatBeleg('zielD5') ? A(T('Kein Platz für eine Baumrigole.') + beleg('zielD5')) : N(T('Nicht als Zielanlage angegeben.'));
    if (k === 'D6') return s.ziel.d6 ? N(`${T('Das Dachwasser fliesst bereits in {0}; dasselbe Wasser zählt nur einmal.', ziel)}`) : hatBeleg('zielD6') ? A(T('Keine Freifläche für eine Mulde.') + beleg('zielD6')) : N(T('Nicht als Zielanlage angegeben.'));
    return null;
  };
  for (const k of ['D1', 'D2', 'D3', 'D4', 'D5', 'D6', 'D7', 'D8']) {
    if (drin.has(k)) continue;
    const g = f.gestrichen.find(x => x.key === k);
    if (g) { out.push({ k, kat: 'ausgeschlossen', grund: T('Gestrichen: {0}.', esc(g.grund || T('ohne Begründung'))) }); continue; }
    const r = offenModus && mgl.has(k) ? null : regel(k);
    out.push({ k, ...(r || { kat: 'ungeklaert', grund: frage ? `${T('Hängt von der offenen Angabe ab: «{0}»', esc(frage))}` : T('Noch ungeklärt.') }) });
  }
  return out;
}

// ---------- Rangliste ----------
function vRangliste() {
  const l = [...flaechenVon(projektAktiv())].sort((a, b) => summe(b) - summe(a) || (+b.gefM2 || 0) - (+a.gefM2 || 0));
  let h = `<div class="card"><h2>${T('Rangliste der Flächen')}</h2>
    <ol>${LF.rangliste.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
    <label for="schwelle">${T('Summe, ab der eine Fläche als «in der Summe hoch» gilt (ganze Zahl 3 bis 9)')}</label>
    <input id="schwelle" type="text" inputmode="numeric" value="${S.einstellungen.schwelle}" aria-describedby="schwelle-fehler" onchange="schwelleSetzen(this)" style="max-width:120px">
    <p class="feldfehler" id="schwelle-fehler" aria-live="polite"></p>
    <label for="stufenNotiz">${T('So hat unsere Gemeinde die Stufengrenzen gesetzt')}</label>
    <textarea id="stufenNotiz" oninput="S.einstellungen.stufenNotiz=this.value;save()">${esc(S.einstellungen.stufenNotiz)}</textarea>
    ${LF.ranglisteHinweise.map(t => `<div class="hint">${esc(t)}</div>`).join('')}</div>`;
  if (!l.length) return h + `<div class="hint">${T('Noch keine Flächen erfasst.')}</div>`;
  h += `<div class="card"><h3>${T('Ihre Flächen nach Belastung')}</h3><div class="tabelle" role="region" aria-label="${T('Rangliste der Flächen')}" tabindex="0"><table><thead><tr><th>${T('Fläche')}</th><th>${T('Nacht')}</th><th>${T('Versiegelung')}</th><th>${T('Überflutung')}</th><th>${T('Summe')}</th><th>m²</th><th>${T('Vorrang')}</th></tr></thead><tbody>`;
  l.forEach(f => h += `<tr><td><button class="link" data-act="oeffnen" data-id="${esc(f.id)}">${esc(f.name)}</button></td><td>${STUFE[f.stufen.ueberw]}</td><td>${STUFE[f.stufen.versieg]}</td><td>${STUFE[f.stufen.ueberfl]}</td><td><b>${summe(f) || '–'}</b></td><td>${esc(f.gefM2 || '–')}${zahlFehler(f.gefM2) ? T(' (ungültig)') : ''}</td><td>${vorrang(f) ? T('<span class="tag vor">Vorrang</span>') : '–'}</td></tr>`);
  return h + '</tbody></table></div></div>';
}
// Rangschwelle: nur ganze Zahlen 3 bis 9 (Spannweite der Summe); ungültige Eingaben werden nicht still ersetzt.
function schwelleSetzen(el) {
  const v = el.value.trim(), ok = /^\d+$/.test(v) && +v >= 3 && +v <= 9;
  el.setAttribute('aria-invalid', ok ? 'false' : 'true');
  document.getElementById('schwelle-fehler').textContent = ok ? '' : `${T('Bitte eine ganze Zahl von 3 bis 9 eingeben. Nicht gespeichert; es gilt weiterhin {0}.', S.einstellungen.schwelle)}`;
  if (!ok) return;
  S.einstellungen.schwelle = +v; rerender();
}

// Wird beim Start (ohne Sperre) und nach dem Entsperren ausgeführt.
function nachStart() { neuAuswerten().then(originalePruefen).then(n => { if (n) render(); }).then(() => indexAufbauen()).catch(() => {}); }
ablageStartzustand();
document.getElementById('flaechen-datei').accept = DOC_ACCEPT;
render();
if (!gesperrt) nachStart();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  const hatteSw = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
  // Übernimmt eine neue Fassung, lädt die Seite einmal neu, damit sofort die aktuelle Version läuft.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hatteSw && !sessionStorage.getItem('lf-neu')) { sessionStorage.setItem('lf-neu', '1'); location.reload(); }
  });
}

// Chrome und Edge zeigen damit einen klaren Installationsknopf. Andere Browser
// erhalten stattdessen die passende kurze Anleitung.
let installPrompt;
const installButton = document.getElementById('install');
if (location.protocol === 'app:') installButton.hidden = true;   // Windows-Anwendung: ist bereits installiert
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
installButton.addEventListener('click', async () => {
  if (installPrompt) {
    installPrompt.prompt();
    await installPrompt.userChoice;
    installPrompt = null;
    return;
  }
  document.getElementById('dlgT').textContent = T('App installieren');
  document.getElementById('dlgC').innerHTML = T('<p><b>Android:</b> Link in Chrome öffnen, Menü wählen und «App installieren» antippen.</p><p><b>iPhone/iPad:</b> Link in Safari öffnen, Teilen wählen und «Zum Home-Bildschirm» antippen.</p><p><b>Windows:</b> Link in Edge öffnen, Menü «Apps» wählen und «Diese Website als App installieren» anklicken.</p><p class="muted">Die Installation funktioniert nach der Veröffentlichung über HTTPS.</p>');
  document.getElementById('dlg').showModal();
});
window.addEventListener('appinstalled', () => { installPrompt = null; installButton.hidden = true; });
</script>
